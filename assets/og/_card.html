<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="robots" content="noindex, nofollow"/>
<title>OG card renderer</title>
<!-- Renders one social card at 1200x630 from _cards.json:
       /assets/og/_card.html?slug=<slug>
     kind "page": drawn here in the v2 block grammar from {eyebrow, title}.
     kind "article": the recoloured illustration in _src/<slug>.svg, inlined so
     Switzer from tokens.css reaches its <text>.
     Rasterize with a real 1200x630 PNG screenshot (see README, OG cards);
     never with a display screenshot. Underscore files are not deployed. -->
<link rel="stylesheet" href="/tokens.css"/>
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--paper)}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased;color:var(--ink)}
  .card{position:relative;width:1200px;height:630px;box-sizing:border-box;padding:36px;display:grid;
        grid-template-columns:1fr 300px;grid-template-rows:1fr 150px;gap:14px}
  .blk{border-radius:28px;box-sizing:border-box}
  .main{grid-row:1 / 3;background:var(--white);padding:52px 56px 50px;display:flex;flex-direction:column;
        justify-content:space-between;box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 5%,transparent)}
  .eyebrow{display:flex;align-items:center;gap:12px;font-size:21px;font-weight:500;letter-spacing:.01em;color:var(--ink-2)}
  .eyebrow i{width:12px;height:12px;border-radius:50%;background:var(--accent);flex:none}
  h1{margin:0;font-weight:600;letter-spacing:-.035em;line-height:1.04;color:var(--ink);text-wrap:balance}
  .url{font-size:20px;font-weight:500;color:var(--ink-3);letter-spacing:-.005em}
  .field{background:var(--primary);display:grid;place-items:center;position:relative;overflow:hidden}
  .field svg{width:132px;height:auto}
  .field .ring{position:absolute;inset:auto -60px -60px auto;width:220px;height:220px;border-radius:50%;
               border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
  .field .ring.two{width:340px;height:340px;inset:auto -120px -120px auto;border-color:color-mix(in srgb,var(--accent) 18%,transparent)}
  .pill{border-radius:60px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;gap:12px;
        font-size:34px;font-weight:600;letter-spacing:-.02em}
  .pill svg{width:36px;height:auto}
  .art{width:1200px;height:630px}
  .art svg{display:block;width:1200px;height:630px}
  /* Consent controls belong to the website, never to exported artwork. */
  #cc-main,[data-cookie-settings]{display:none!important}
</style>
</head>
<body>
<div id="out"></div>
<script>
(async function () {
  var MARK = '<svg viewBox="13 4 144 156" aria-hidden="true"><path d="M14 140 L85 6 L156 140 L128 140 L85 58 L42 140 Z" fill="currentColor"/><path d="M50 140 L85 72 L120 140 L96 140 L85 118 L74 140 Z" fill="currentColor"/><path d="M18 153 L152 153" stroke="currentColor" stroke-width="9" stroke-linecap="round"/></svg>';
  var slug = new URLSearchParams(location.search).get('slug') || 'index';
  var cards = await (await fetch('/assets/og/_cards.json', { cache: 'no-store' })).json();
  var c = cards[slug], out = document.getElementById('out');
  await document.fonts.load('600 40px Switzer');
  await document.fonts.load('500 20px Switzer');
  if (!c) { out.textContent = 'no card for ' + slug; document.body.dataset.ready = 'error'; return; }
  if (c.kind === 'article') {
    var svg = await (await fetch('/assets/og/_src/' + slug + '.svg', { cache: 'no-store' })).text();
    out.innerHTML = '<div class="art">' + svg + '</div>';
  } else {
    var esc = function (s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
    out.innerHTML =
      '<div class="card">' +
        '<div class="blk main"><div class="eyebrow"><i></i>' + esc(c.eyebrow) + '</div>' +
          '<h1>' + esc(c.title) + '</h1>' +
          '<div class="url">adgent.app' + (slug === 'index' ? '' : '/' + slug) + '</div></div>' +
        '<div class="blk field" style="color:var(--accent)"><span class="ring two"></span><span class="ring"></span>' + MARK + '</div>' +
        '<div class="blk pill">' + MARK + 'Adgent</div>' +
      '</div>';
    // fit: the largest size (84 -> 52px) that keeps the headline within 3 lines and the block
    var h1 = out.querySelector('h1'), main = out.querySelector('.main');
    for (var size = 84; size >= 52; size -= 2) {
      h1.style.fontSize = size + 'px';
      var lines = Math.round(h1.getBoundingClientRect().height / (size * 1.04));
      if (lines <= 3 && main.scrollHeight <= main.clientHeight) break;
    }
  }
  document.body.dataset.ready = 'yes';
})();
</script>
</body>
</html>
